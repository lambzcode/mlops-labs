global:
  scrape_interval: 5s              # lab value; production uses 15s to 60s
  evaluation_interval: 5s
rule_files: [alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics/        # the app mounts the metrics app at /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]   # the API runs on your machine

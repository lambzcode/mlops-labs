<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="DockerCoins: the worker gets bytes from rng, hashes them with hasher, counts in redis; webui reads redis"><title>DockerCoins: the worker gets bytes from rng, hashes them with hasher, counts in redis; webui reads redis</title><style>text{font-family:'Source Sans Pro','Source Sans 3',Helvetica,Arial,sans-serif;fill:#222222} .s{fill:#52514e} .m{fill:#8a8984} .b{font-weight:700} .mono{font-family:'Source Code Pro',Menlo,Consolas,monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="1000" height="350" fill="#ffffff"/><rect x="40" y="30" width="240" height="100" rx="10" fill="#f2f1ee" stroke="#dcdad5"/><rect x="40" y="30" width="8" height="100" rx="4" fill="#eb6834"/><text x="64" y="66" font-size="22" class="b mono">rng</text><text x="64" y="92" font-size="16" class="s">random bytes</text><text x="64" y="114" font-size="14" class="m">Service port 80</text><rect x="40" y="190" width="240" height="100" rx="10" fill="#f2f1ee" stroke="#dcdad5"/><rect x="40" y="190" width="8" height="100" rx="4" fill="#1baf7a"/><text x="64" y="226" font-size="22" class="b mono">hasher</text><text x="64" y="252" font-size="16" class="s">SHA-256 hash</text><text x="64" y="274" font-size="14" class="m">Service port 80</text><rect x="380" y="110" width="240" height="100" rx="10" fill="#f2f1ee" stroke="#dcdad5"/><rect x="380" y="110" width="8" height="100" rx="4" fill="#2a78d6"/><text x="404" y="146" font-size="22" class="b mono">worker</text><text x="404" y="172" font-size="16" class="s">loops: get, hash, count</text><text x="404" y="194" font-size="14" class="m">no Service, only calls out</text><rect x="720" y="30" width="240" height="100" rx="10" fill="#f2f1ee" stroke="#dcdad5"/><rect x="720" y="30" width="8" height="100" rx="4" fill="#e34948"/><text x="744" y="66" font-size="22" class="b mono">redis</text><text x="744" y="92" font-size="16" class="s">stores the counters</text><text x="744" y="114" font-size="14" class="m">Service port 6379</text><rect x="720" y="190" width="240" height="100" rx="10" fill="#f2f1ee" stroke="#dcdad5"/><rect x="720" y="190" width="8" height="100" rx="4" fill="#4a3aa7"/><text x="744" y="226" font-size="22" class="b mono">webui</text><text x="744" y="252" font-size="16" class="s">shows the speed</text><text x="744" y="274" font-size="14" class="m">Service port 80</text><line x1="380" y1="140" x2="284" y2="90" stroke="#52514e" stroke-width="3" marker-end="url(#a)"/><line x1="380" y1="180" x2="284" y2="230" stroke="#52514e" stroke-width="3" marker-end="url(#a)"/><text x="292" y="66" font-size="15" class="s">1 get random bytes</text><text x="292" y="266" font-size="15" class="s">2 hash them</text><line x1="620" y1="140" x2="720" y2="85" stroke="#52514e" stroke-width="3" marker-end="url(#a)"/><text x="636" y="168" font-size="15" class="s">3 count</text><line x1="840" y1="190" x2="840" y2="132" stroke="#52514e" stroke-width="3" marker-end="url(#a)"/><text x="852" y="165" font-size="15" class="s">4 read</text><text x="40" y="330" font-size="17" class="s">Four Services give the pods a name (<tspan class="mono">rng</tspan>, <tspan class="mono">hasher</tspan>, <tspan class="mono">redis</tspan>, <tspan class="mono">webui</tspan>); the worker only calls out.</text></svg>